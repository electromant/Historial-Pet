<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial Pet - Gestión Clínica Veterinaria</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        /* VISTA DE PORTADA / LANDING */
        #vista-portada {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            text-align: center;
            padding: 20px;
        }

        .card-portada {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            max-width: 500px;
            width: 100%;
        }

        .card-portada img {
            width: 100%;
            max-width: 320px;
            height: auto;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .btn-ingresar {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            width: 100%;
            margin-top: 15px;
        }

        .btn-ingresar:hover {
            background-color: #1b5e20;
            transform: translateY(-2px);
        }

        /* HEADER Y NAVEGACIÓN PRINCIPAL */
        header {
            background-color: #2e7d32;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-brand img {
            height: 45px;
            width: auto;
            border-radius: 6px;
            background: white;
            padding: 2px;
        }

        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .btn-primary {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;

        }

        .btn-primary:hover {
            background-color: #1b5e20;
        }

        .grid-pacientes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .paciente-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .btn-secondary {
            background-color: #0288d1;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
    <!-- SweetAlert2 CDN -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <!-- 1. VISTA DE PORTADA / BIENVENIDA -->
    <div id="vista-portada">
        <div class="card-portada">
            <img src="logo.jpg" alt="Logo Historial Pet">
            <p style="color: #666; margin-bottom: 10px; font-size: 1rem;">Plataforma Integral de Gestión Clínica Veterinaria</p>
            <button class="btn-ingresar" id="btn-entrar-sistema">🚀 Entrar al Sistema</button>
        </div>
    </div>

    <!-- 2. VISTA PRINCIPAL (OCULTA INICIALMENTE) -->
    <div id="vista-principal" style="display: none;">
        <header>
            <div class="header-brand">
                <img src="logo.jpg" alt="Logo Pet">
                <div>
                    <h2>Historial Pet</h2>
                    <small style="opacity: 0.85;">Gestión Clínica Veterinaria</small>
                </div>
            </div>
            <button class="btn-secondary" id="btn-volver-portada" style="background: rgba(255,255,255,0.2); border: 1px solid white;">🏠 Inicio</button>
        </header>

        <div class="container">
            <!-- Formulario de Ingreso -->
            <div class="card">
                <h3 style="color: #2e7d32; margin-bottom: 15px;">📋 Registro de Ingreso de Paciente</h3>
                <form id="form-paciente">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Nombre de la Mascota *</label>
                            <input type="text" id="nombre" required placeholder="Ej. Cocoliso">
                        </div>
                        <div class="form-group">
                            <label>Especie *</label>
                            <select id="tipo" required>
                                <option value="Perros">Perros</option>
                                <option value="Gatos">Gatos</option>
                                <option value="Aves">Aves</option>
                                <option value="Otros">Otros</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Raza</label>
                            <input type="text" id="raza" placeholder="Ej. Criollo">
                        </div>
                        <div class="form-group">
                            <label>Edad (Años)</label>
                            <input type="number" id="edad" placeholder="Ej. 3">
                        </div>
                        <div class="form-group">
                            <label>Nombre del Propietario *</label>
                            <input type="text" id="propietario" required placeholder="Ej. Yeison Iza">
                        </div>
                        <div class="form-group">
                            <label>Teléfono de Contacto</label>
                            <input type="text" id="telefono" placeholder="Ej. 3001234567">
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 15px;">
                        <label>Foto de la Mascota</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="file" id="foto" accept="image/*" style="flex: 1;">
                            <button type="button" id="btn-limpiar-foto" style="background: #d32f2f; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer;">Quitar Foto</button>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" style="width: 100%;">Guardar e Ingresar Paciente</button>
                </form>
            </div>

            <!-- Búsqueda y Lista de Pacientes -->
            <div class="card">
                <h3 style="color: #2e7d32; margin-bottom: 15px;">🔍 Buscar Paciente o Historial Clínico</h3>
                <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                    <input type="text" id="input-busqueda" placeholder="Buscar por Nombre, Propietario o N° Radicado..." style="flex: 2; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
                    <select id="filtro-tipo" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
                        <option value="todos">Todos los tipos</option>
                        <option value="Perros">Perros</option>
                        <option value="Gatos">Gatos</option>
                        <option value="Aves">Aves</option>
                        <option value="Otros">Otros</option>
                    </select>
                    <button id="btn-buscar" class="btn-secondary" style="padding: 10px 20px;">Buscar</button>
                </div>

                <div id="contenedor-pacientes" class="grid-pacientes">
                    <!-- Tarjetas cargadas dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- 3. VISTA DE DETALLE DEL PACIENTE (OCULTA INICIALMENTE) -->
    <div id="vista-detalle" style="display: none;">
        <header>
            <div class="header-brand">
                <img src="logo.jpg" alt="Logo Pet">
                <h2>Historial Clínico de Mascota</h2>
            </div>
            <button class="btn-secondary" id="btn-volver-inicio" style="background: rgba(255,255,255,0.2); border: 1px solid white;">Volver a Pacientes</button>
        </header>

        <div class="container">
            <div class="card" id="info-paciente-detalle">
                <!-- Info detallada cargada por JS -->
            </div>

            <!-- Formulario de Consulta -->
            <div class="card">
                <h3 style="color: #2e7d32; margin-bottom: 15px;">📝 Registrar Nueva Consulta Médica</h3>
                <form id="form-consulta">
                    <input type="hidden" id="paciente-id-actual">
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label>Motivo / Diagnóstico *</label>
                        <textarea id="motivo" required style="width: 100%; height: 70px; padding: 8px;" placeholder="Descripción del motivo de consulta o diagnóstico..."></textarea>
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label>Tratamiento / Prescripción Médica *</label>
                        <textarea id="tratamiento" required style="width: 100%; height: 90px; padding: 8px;" placeholder="Ej. Amoxicilina 250mg cada 12 horas por 7 días..."></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">💾 Guardar Consulta</button>
                </form>
            </div>

            <!-- Historial -->
            <div class="card">
                <h3 style="color: #2e7d32; margin-bottom: 15px;">📜 Historial Clínico de Consultas</h3>
                <div id="lista-historial-clinico">
                    <!-- Consultas cargadas por JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
